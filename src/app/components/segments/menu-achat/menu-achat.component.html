<div class="card container-fluid mb-2 table-responsive pb-3">
    <div class="card">
        <div class="card-header">
            <ul class="nav nav-tabs card-header-tabs" data-bs-toggle="tabs" role="tablist">

                <li class="nav-item" role="presentation"
                    *ngIf="userService.checkPermissionExistence(firstRoleName+ ' créer achat Achat')">
                    <a href="javascript:void(0)" routerLink='/achat-nouveau'
                        [ngClass]="{ 'active': router.url === '/achat-nouveau' }" class="nav-link" data-bs-toggle="tab"
                        aria-selected="false" role="tab" tabindex="-1">Achat</a>
                </li>

                <li class="nav-item" role="presentation"
                    *ngIf="userService.checkPermissionExistence(firstRoleName+ ' voir facture achat Achat')">
                    <a href="javascript:void(0)" routerLink='/achat' class="nav-link"
                        [ngClass]="{ 'active': router.url === '/achat' }" data-bs-toggle="tab" aria-selected="true"
                        role="tab">Factures Achats</a>
                </li>

                <li class="nav-item" role="presentation"
                    *ngIf="userService.checkPermissionExistence(firstRoleName+ ' voir bon achat Achat')">
                    <a href="javascript:void(0)" routerLink='/bon-achat' class="nav-link"
                        [ngClass]="{ 'active': router.url === '/bon-achat' }" data-bs-toggle="tab" aria-selected="true"
                        role="tab">Bons d'achats</a>
                </li>

                <li class="nav-item" role="presentation">
                    <a href="javascript:void(0)" routerLink='/list-justification-achat' class="nav-link"
                        [ngClass]="{ 'active': router.url === '/list-justification-achat' }" data-bs-toggle="tab"
                        aria-selected="true" role="tab">Justification Achat</a>
                </li>

            </ul>
            <a *ngIf="router.url === '/achat' && userService.checkPermissionExistence(firstRoleName+ ' créer achat Achat')"
                href="javascript:void(0)" routerLink='/achat-nouveau' class="btn btn-success mx-1 w-auto">Nouveau
                Achat</a>
            <a *ngIf="router.url === '/bon-achat' && userService.checkPermissionExistence(firstRoleName+ ' créer bon achat Achat')"
                href="javascript:void(0)" routerLink='/achat-nouveau' class="btn btn-success mx-1 w-auto">Nouveau bon
                d'achat</a>
            <a *ngIf="router.url === '/list-justification-achat' && userService.checkPermissionExistence(firstRoleName+ ' avoir accès justification Achat')"
                href="javascript:void(0)" routerLink='/justification-achat' class="btn btn-success mx-1 w-auto">Nouvelle
                Justification</a>
        </div>
    </div>
</div>
