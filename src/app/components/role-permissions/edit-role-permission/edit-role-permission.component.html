<app-menu-utilisateur></app-menu-utilisateur>

<div class="main-content  my-4">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-light">
      <div class="mb-0 h3">Modifier les permissions du rôle</div>
    </div>
    <div class="card-body">

      <!-- Nom du rôle -->
      <div class="mb-4">
        <label for="roleName" class="form-label fw-bold">Nom du rôle</label>
        <input type="text" id="roleName" class="form-control" [(ngModel)]="name" readonly />
      </div>

      <!-- Permissions -->
      <div class="mb-3">
        <label class="form-label fw-bold">Permissions</label>
      </div>

      <div *ngFor="let module of permissions; let i = index" class="mb-4">
        <div class="card border">
          <div class="card-header bg-light d-flex justify-content-between align-items-center">
            <strong>Module : {{ module.module }}</strong>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" [(ngModel)]="module.etat" (change)="toggleAll(i)"
                id="checkAll-{{i}}" />
              <label class="form-check-label" for="checkAll-{{i}}">
                Tout cocher
              </label>
            </div>
          </div>
          <div class="card-body">
            <div class="row">
              <div *ngFor="let action of module.options; let j = index" class="col-md-6 col-lg-4 mb-2">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" [(ngModel)]="action.checked"
                    (change)="checkIfAllSelected(i)" id="perm-{{i}}-{{j}}" />
                  <label class="form-check-label" for="perm-{{i}}-{{j}}">
                    {{ action.name }}
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Bouton Enregistrer -->
      <div class="text-end mt-4">
        <button [disabled]="isDisable " type="button" (click)="updateRole()" class="btn btn-success px-4">
          <span *ngIf="!isDisable && !isClick">Modifier</span>
          <span *ngIf="isDisable && isClick" class="spinner-border spinner-border-sm mx-1"></span>
          <span *ngIf="isDisable && isClick">Chargement...</span>
        </button>
      </div>

    </div>
  </div>
</div>
